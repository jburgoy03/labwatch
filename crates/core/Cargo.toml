[package]
name = "labwatch-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bollard = "0.21.1"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
sysinfo = "0.39.6"
tokio = { version = "1.54.1", features = ["rt", "time"] }
toml = "1.1.8"

[dev-dependencies]
serde_json = "1"
