<section class="timeline" id="timeline" data-status="{{ status.as_str() }}"
         sse-swap="timeline" hx-swap="outerHTML" aria-labelledby="timeline-title">
  <div class="timeline-head">
    <h2 id="timeline-title">Last 24 hours</h2>
    <p class="timeline-summary">{{ summary }}</p>
  </div>

  <div class="paper">
    <span class="trace"></span>
    {% for mark in marks %}
      <span class="pulse{% if mark.open %} is-open{% endif %}" data-status="{{ mark.status.as_str() }}"
            {% if mark.open %}style="right: 0; width: max(6px, {{ "{:.2}"|format(mark.width) }}%)"{% else %}style="left: {{ "{:.2}"|format(mark.left) }}%; width: {{ "{:.2}"|format(mark.width) }}%"{% endif %}
            title="{{ mark.label }}">
        {% if let Some(note) = mark.note %}
          <span class="pulse-note{% if mark.left > 85.0 %} is-end{% endif %}">{{ note }}</span>
        {% endif %}
      </span>
    {% endfor %}
  </div>

  <div class="hours" aria-hidden="true">
    <span>24 h ago</span><span>18 h</span><span>12 h</span><span>6 h</span><span>Now</span>
  </div>
</section>
