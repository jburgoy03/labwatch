<header class="base" id="base" data-status="{{ status.as_str() }}" data-title="{{ tab_title }}"
        sse-swap="summary" hx-swap="outerHTML">
  <div class="lamp" role="img" aria-label="Overall status: {{ status }}"><div class="lamp-glass"></div></div>

  <div class="base-text">
    <h1 class="base-headline">{{ headline }}</h1>
    <p class="base-detail">{{ detail }}</p>
  </div>

  <div class="base-meta">
    <p class="base-host">{{ host }}</p>
    <p>{{ uptime }}</p>
  </div>
</header>
